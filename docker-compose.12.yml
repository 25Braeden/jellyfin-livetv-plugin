services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: jellyfin-dev-12
    environment:
      TZ: America/New_York
    ports:
      - "8097:8096/tcp"
    volumes:
      - ./local12/config:/config
      - ./local12/cache:/cache
      - ./test-media:/media:ro
      - ./tuners:/tuners:ro
    restart: unless-stopped

  # Serves ./test-media over HTTP so the fake M3U tuners have "streams" to point at.
  # Own copy so this stack is self-contained and can run next to the 10.11 stack
  # (which uses host port 8081). Inside this stack it answers to "fakestreams",
  # same as the M3U playlists expect.
  fakestreams:
    image: nginx:alpine
    container_name: fakestreams-12
    volumes:
      - ./test-media:/usr/share/nginx/html:ro
      - ./fakestreams/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80/tcp"
    restart: unless-stopped
