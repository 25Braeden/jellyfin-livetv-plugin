# Fake IPTV provider. Plain files are served at full speed; *.ts is throttled to roughly the
# fixture's bitrate (~126 kbps) so a finite file behaves like a live stream for Jellyfin's
# SharedHttpStream (which stops sharing once the upstream download ends).
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ \.ts$ {
        limit_rate_after 64k;
        limit_rate 24k;
    }
}
